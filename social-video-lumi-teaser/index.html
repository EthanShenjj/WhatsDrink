<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
      @font-face { font-family: "Menlo"; src: local("Menlo"); }
      * { box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: #070817;
      }
      body {
        color: #f5f4ff;
        font-family: "PingFang SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #lumi-3d-teaser {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #070817;
        isolation: isolate;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        transform-origin: 50% 50%;
      }
      .scene-content {
        position: relative;
        z-index: 10;
        display: flex;
        width: 100%;
        height: 100%;
        padding: 120px 84px 380px;
        flex-direction: column;
        box-sizing: border-box;
      }
      .camera {
        position: absolute;
        inset: -100px;
        transform-style: preserve-3d;
        perspective: 1200px;
      }
      .scene-one {
        z-index: 1;
        background-color: #070817;
        background-image:
          radial-gradient(circle at 28% 18%, rgba(120,167,255,.18) 0 6%, rgba(120,167,255,0) 34%),
          radial-gradient(circle at 76% 58%, rgba(195,167,255,.16) 0 10%, rgba(195,167,255,0) 38%);
      }
      .scene-two {
        z-index: 2;
        clip-path: circle(.01% at 78% 47%);
        background-color: #17133a;
        background-image:
          radial-gradient(circle at 72% 42%, rgba(255,207,138,.19) 0 4%, rgba(255,207,138,0) 30%),
          radial-gradient(circle at 34% 60%, rgba(120,167,255,.22) 0 8%, rgba(120,167,255,0) 40%);
      }
      .scene-three {
        z-index: 3;
        clip-path: inset(100% 0 0 0);
        color: #141425;
        background-color: #f5f4ff;
        background-image:
          radial-gradient(circle at 26% 20%, rgba(120,167,255,.25) 0 8%, rgba(120,167,255,0) 32%),
          radial-gradient(circle at 82% 70%, rgba(195,167,255,.35) 0 12%, rgba(195,167,255,0) 40%);
      }
      .vignette {
        position: absolute;
        inset: 0;
        z-index: 18;
        pointer-events: none;
        box-shadow: inset 0 0 210px rgba(0,0,0,.68);
      }
      .film-grain {
        position: absolute;
        inset: 0;
        z-index: 17;
        pointer-events: none;
        opacity: .18;
        background-image:
          radial-gradient(circle at 20% 15%, rgba(255,255,255,.15) 0 1px, rgba(255,255,255,0) 1.7px),
          radial-gradient(circle at 70% 65%, rgba(195,167,255,.16) 0 1px, rgba(195,167,255,0) 1.6px);
        background-size: 37px 37px, 29px 29px;
        mix-blend-mode: soft-light;
      }
      .meta {
        position: absolute;
        z-index: 14;
        color: rgba(245,244,255,.67);
        font-family: "Menlo", monospace;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: .12em;
        line-height: 1.6;
        font-variant-numeric: tabular-nums;
      }
      .meta span { display: block; }

      /* Scene 1 — IP awakening in a spatial light stage */
      .stage-horizon {
        position: absolute;
        z-index: 2;
        left: 50%;
        bottom: 300px;
        width: 900px;
        height: 470px;
        border-radius: 50%;
        background:
          radial-gradient(ellipse at center, rgba(120,167,255,.26) 0 10%, rgba(79,56,214,.12) 29%, rgba(7,8,23,0) 66%);
        filter: blur(10px);
        transform: translateX(-50%) rotateX(72deg);
      }
      .hero-wrap {
        position: absolute;
        z-index: 8;
        top: 430px;
        left: 50%;
        width: 900px;
        height: 900px;
        transform: translateX(-50%);
        transform-style: preserve-3d;
        filter: drop-shadow(0 80px 70px rgba(17,15,55,.75));
      }
      .hero-img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform-origin: 52% 72%;
        will-change: transform, filter;
      }
      .hero-aura {
        position: absolute;
        z-index: 3;
        top: 400px;
        left: 50%;
        width: 760px;
        height: 760px;
        border-radius: 50%;
        border: 1px solid rgba(195,167,255,.24);
        box-shadow:
          0 0 0 78px rgba(120,167,255,.035),
          0 0 0 156px rgba(195,167,255,.025),
          inset 0 0 120px rgba(120,167,255,.14);
        transform: translateX(-50%);
      }
      .hero-aura::before,
      .hero-aura::after {
        content: "";
        position: absolute;
        inset: 80px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 48% 52% 44% 56%;
        transform: rotate(18deg);
      }
      .hero-aura::after {
        inset: 160px;
        border-color: rgba(255,207,138,.16);
        transform: rotate(-28deg);
      }
      .beam {
        position: absolute;
        z-index: 1;
        top: -220px;
        left: 72px;
        width: 360px;
        height: 1500px;
        background: linear-gradient(180deg, rgba(120,167,255,.28), rgba(195,167,255,.06) 55%, rgba(195,167,255,0));
        clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
        filter: blur(28px);
        transform: rotate(-13deg);
        mix-blend-mode: screen;
      }
      .coord-one { top: 174px; left: 84px; }
      .coord-line {
        position: absolute;
        z-index: 14;
        top: 244px;
        left: 84px;
        width: 180px;
        height: 2px;
        background-color: rgba(195,167,255,.58);
        transform-origin: left center;
      }
      .pulse-dot {
        position: absolute;
        z-index: 13;
        top: 270px;
        right: 154px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background-color: #ffcf8a;
        box-shadow: 0 0 0 16px rgba(255,207,138,.08), 0 0 50px rgba(255,207,138,.75);
      }
      .foreground-orb {
        position: absolute;
        z-index: 15;
        border-radius: 50%;
        filter: blur(3px);
        background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.75), rgba(195,167,255,.42) 22%, rgba(79,56,214,.23) 58%, rgba(79,56,214,0) 72%);
        mix-blend-mode: screen;
      }
      .foreground-orb.o1 { width: 210px; height: 210px; left: -70px; bottom: 330px; }
      .foreground-orb.o2 { width: 126px; height: 126px; right: -28px; top: 520px; opacity: .58; }

      /* Scene 2 — hidden product signals become spatial memories */
      .discover-camera {
        position: absolute;
        inset: -120px;
        transform-style: preserve-3d;
      }
      .discover-wrap {
        position: absolute;
        z-index: 9;
        top: 470px;
        left: 50%;
        width: 900px;
        height: 820px;
        transform: translateX(-50%);
        filter: drop-shadow(0 78px 75px rgba(4,5,20,.68));
      }
      .discover-img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform-origin: 55% 70%;
      }
      .path-field {
        position: absolute;
        z-index: 4;
        left: -120px;
        top: 840px;
        width: 1360px;
        height: 620px;
        transform: rotateX(58deg) rotateZ(-8deg);
        transform-origin: center;
        filter: drop-shadow(0 0 22px rgba(120,167,255,.48));
      }
      .path-field svg { width: 100%; height: 100%; overflow: visible; }
      .path-glow {
        fill: none;
        stroke: rgba(120,167,255,.18);
        stroke-width: 34;
        stroke-linecap: round;
      }
      .path-core {
        fill: none;
        stroke: #c3a7ff;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-dasharray: 1460;
        stroke-dashoffset: 1460;
      }
      .memory-card {
        position: absolute;
        z-index: 11;
        width: 210px;
        height: 270px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.42);
        border-radius: 38px;
        background-color: rgba(255,255,255,.1);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 34px 60px rgba(2,2,15,.35);
        backdrop-filter: blur(16px);
        transform-style: preserve-3d;
      }
      .photo-card {
        top: 286px;
        left: -50px;
        transform: rotateY(28deg) rotateZ(-9deg);
      }
      .photo-card::before {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 26px;
        background:
          radial-gradient(circle at 72% 23%, #ffcf8a 0 8%, rgba(255,207,138,0) 9%),
          linear-gradient(145deg, rgba(120,167,255,.94), rgba(195,167,255,.9) 52%, rgba(255,207,138,.86));
      }
      .photo-card::after {
        content: "";
        position: absolute;
        left: 44px;
        right: 44px;
        bottom: 58px;
        height: 78px;
        border-radius: 60% 40% 0 0;
        background-color: rgba(23,19,58,.42);
        transform: rotate(-7deg);
      }
      .date-card {
        top: 980px;
        right: -32px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(245,244,255,.9);
        font-family: "Menlo", monospace;
        font-size: 42px;
        font-weight: 700;
        letter-spacing: -.05em;
        font-variant-numeric: tabular-nums;
        transform: rotateY(-26deg) rotateZ(7deg);
      }
      .mood-bead {
        position: absolute;
        z-index: 12;
        top: 344px;
        right: 74px;
        width: 86px;
        height: 86px;
        border: 2px solid rgba(255,255,255,.5);
        border-radius: 50%;
        background-color: #42c8df;
        box-shadow: inset 0 0 24px rgba(255,255,255,.46), 0 0 70px rgba(66,200,223,.7);
      }
      .pin-node {
        position: absolute;
        z-index: 7;
        width: 32px;
        height: 32px;
        border-radius: 50% 50% 50% 6px;
        background-color: #c3a7ff;
        box-shadow: 0 0 0 10px rgba(195,167,255,.08), 0 0 34px rgba(195,167,255,.72);
        transform: rotate(-45deg);
      }
      .pin-node.p1 { left: 172px; top: 1045px; }
      .pin-node.p2 { right: 188px; top: 1220px; }
      .coord-two { right: 86px; bottom: 414px; text-align: right; color: rgba(245,244,255,.52); }
      .glass-foreground {
        position: absolute;
        z-index: 16;
        left: -180px;
        bottom: 160px;
        width: 460px;
        height: 620px;
        border: 2px solid rgba(255,255,255,.35);
        border-radius: 80px;
        background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(120,167,255,.05));
        box-shadow: inset 0 0 65px rgba(195,167,255,.16);
        backdrop-filter: blur(14px);
        transform: rotateZ(18deg) rotateY(32deg);
      }

      /* Scene 3 — quiet character and brand resolve */
      .final-halo {
        position: absolute;
        z-index: 2;
        left: 50%;
        top: 480px;
        width: 920px;
        height: 920px;
        border-radius: 50%;
        background:
          radial-gradient(circle at center, rgba(255,255,255,.96) 0 20%, rgba(195,167,255,.25) 45%, rgba(120,167,255,0) 72%);
        transform: translateX(-50%);
      }
      .final-rings {
        position: absolute;
        z-index: 3;
        left: 50%;
        top: 555px;
        width: 770px;
        height: 770px;
        border: 1px solid rgba(79,56,214,.14);
        border-radius: 50%;
        box-shadow: 0 0 0 82px rgba(79,56,214,.035), 0 0 0 164px rgba(120,167,255,.025);
        transform: translateX(-50%);
      }
      .final-hero {
        position: absolute;
        z-index: 7;
        top: 560px;
        left: 50%;
        width: 920px;
        height: 900px;
        filter: drop-shadow(0 82px 58px rgba(62,51,132,.24));
        transform: translateX(-50%);
      }
      .final-hero img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform-origin: 52% 75%;
      }
      .brand-block {
        position: absolute;
        z-index: 12;
        top: 158px;
        left: 84px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .brand-name {
        margin: 0;
        color: #141425;
        font-size: 112px;
        font-weight: 800;
        letter-spacing: -.075em;
        line-height: .98;
      }
      .brand-signal {
        display: flex;
        align-items: center;
        gap: 18px;
        color: #514c72;
        font-family: "Menlo", monospace;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: .2em;
      }
      .brand-signal::before {
        content: "";
        width: 46px;
        height: 3px;
        background-color: #4f38d6;
        transform-origin: left center;
      }
      .final-spark {
        position: absolute;
        z-index: 10;
        top: 576px;
        right: 118px;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background-color: #ffcf8a;
        box-shadow: 0 0 55px rgba(255,207,138,.88);
        transform: rotate(45deg);
      }
      .soft-shadow {
        position: absolute;
        z-index: 4;
        left: 50%;
        bottom: 372px;
        width: 560px;
        height: 110px;
        border-radius: 50%;
        background-color: rgba(79,56,214,.16);
        filter: blur(36px);
        transform: translateX(-50%);
      }
      .white-flash {
        position: absolute;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        background-color: #ffffff;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="lumi-3d-teaser"
      data-composition-id="lumi-3d-teaser"
      data-start="0"
      data-duration="11.6"
      data-width="1080"
      data-height="1920"
      data-track-index="0"
    >
      <section id="scene-arrival" class="scene scene-one" data-layout-allow-occlusion data-layout-allow-overlap>
        <div class="camera arrival-camera" data-layout-ignore>
          <div class="beam"></div>
          <div class="hero-aura"></div>
          <div class="stage-horizon"></div>
          <div class="hero-wrap">
            <img class="hero-img" src="assets/3d/lumi-hero.png" alt="" />
          </div>
          <div class="foreground-orb o1"></div>
          <div class="foreground-orb o2"></div>
        </div>
        <div class="meta coord-one"><span>31.2304° N</span><span>121.4737° E</span></div>
        <div class="coord-line"></div>
        <div class="pulse-dot"></div>
        <div class="film-grain"></div>
        <div class="vignette"></div>
      </section>

      <section id="scene-discover" class="scene scene-two" data-layout-allow-occlusion data-layout-allow-overlap>
        <div class="discover-camera" data-layout-ignore>
          <div class="path-field">
            <svg viewBox="0 0 1360 620" aria-hidden="true">
              <path class="path-glow" d="M70 520 C 260 260, 430 550, 620 300 S 980 85, 1290 160" />
              <path class="path-core" d="M70 520 C 260 260, 430 550, 620 300 S 980 85, 1290 160" />
            </svg>
          </div>
          <div class="pin-node p1"></div>
          <div class="pin-node p2"></div>
          <div class="memory-card photo-card"></div>
          <div class="memory-card date-card">09.27</div>
          <div class="mood-bead"></div>
          <div class="discover-wrap">
            <img class="discover-img" src="assets/3d/lumi-discover.png" alt="" />
          </div>
          <div class="glass-foreground"></div>
        </div>
        <div class="meta coord-two"><span>MEMORY / 042</span><span>ALT +18M</span></div>
        <div class="film-grain"></div>
        <div class="vignette"></div>
      </section>

      <section id="scene-resolve" class="scene scene-three">
        <div class="brand-block">
          <h1 class="brand-name">拾光迹</h1>
          <div class="brand-signal">YOUR WORLD, IN MOMENTS</div>
        </div>
        <div class="final-halo"></div>
        <div class="final-rings"></div>
        <div class="soft-shadow"></div>
        <div class="final-hero">
          <img src="assets/3d/lumi-hero-final.png" alt="" />
        </div>
        <div class="final-spark"></div>
        <div class="film-grain"></div>
      </section>

      <div class="white-flash"></div>
      <audio
        id="lumi-score"
        src="assets/lumi-ambient.wav"
        data-start="0"
        data-duration="11.6"
        data-track-index="1"
        data-volume=".92"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene 1 — the approved IP arrives as a tactile 3D presence.
      tl.from(".hero-wrap", {
        y: 130,
        scale: .72,
        rotationY: -18,
        rotationX: 8,
        opacity: 0,
        duration: 1.25,
        ease: "expo.out"
      }, .18);
      tl.from(".hero-aura", {
        scale: .54,
        opacity: 0,
        duration: 1.6,
        ease: "sine.out"
      }, .28);
      tl.from(".beam", {
        x: -180,
        opacity: 0,
        duration: 1.9,
        ease: "power1.out"
      }, .12);
      tl.from(".stage-horizon", {
        scale: .58,
        opacity: 0,
        duration: 1.1,
        ease: "circ.out"
      }, .48);
      tl.from(".coord-one", {
        x: -34,
        opacity: 0,
        duration: .72,
        ease: "power3.out"
      }, .64);
      tl.from(".coord-line", {
        scaleX: 0,
        duration: .5,
        ease: "expo.out"
      }, .82);
      tl.from(".pulse-dot", {
        scale: 0,
        opacity: 0,
        duration: .46,
        ease: "back.out(2.2)"
      }, 1.1);
      tl.from(".foreground-orb.o1", {
        x: -140,
        y: 90,
        scale: .5,
        opacity: 0,
        duration: 1.2,
        ease: "power2.out"
      }, .3);
      tl.from(".foreground-orb.o2", {
        x: 90,
        scale: .6,
        opacity: 0,
        duration: .82,
        ease: "back.out(1.35)"
      }, .86);
      tl.to(".hero-img", {
        y: -20,
        rotation: 1.2,
        scaleX: 1.012,
        scaleY: .988,
        duration: 1.55,
        repeat: 2,
        yoyo: true,
        ease: "sine.inOut"
      }, 1.05);
      tl.to(".arrival-camera", {
        x: -28,
        y: 18,
        rotationY: 2.4,
        scale: 1.045,
        duration: 3.25,
        ease: "none"
      }, .55);
      tl.to(".pulse-dot", {
        backgroundColor: "#c3a7ff",
        boxShadow: "0 0 0 26px rgba(195,167,255,.05), 0 0 72px rgba(195,167,255,.9)",
        duration: .85,
        ease: "sine.inOut"
      }, 2.65);

      // Scene 2 — a glass iris opens; capability signals stay abstract.
      tl.fromTo("#scene-discover", {
        clipPath: "circle(.01% at 78% 47%)"
      }, {
        clipPath: "circle(142% at 78% 47%)",
        duration: .76,
        ease: "power3.inOut"
      }, 3.56);
      tl.from(".discover-wrap", {
        x: 150,
        y: 86,
        scale: .66,
        rotationY: -24,
        opacity: 0,
        duration: 1.05,
        ease: "expo.out"
      }, 3.76);
      tl.from(".path-field", {
        y: 160,
        rotationX: 76,
        opacity: 0,
        duration: 1.1,
        ease: "power2.out"
      }, 3.82);
      tl.to(".path-core", {
        strokeDashoffset: 0,
        duration: 2.45,
        ease: "power1.inOut"
      }, 4.02);
      tl.from(".photo-card", {
        x: -160,
        z: -260,
        rotationY: 68,
        opacity: 0,
        duration: .82,
        ease: "back.out(1.22)"
      }, 4.3);
      tl.from(".date-card", {
        x: 140,
        y: 80,
        z: -180,
        rotationZ: 20,
        opacity: 0,
        duration: .74,
        ease: "circ.out"
      }, 4.82);
      tl.from(".mood-bead", {
        scale: 0,
        x: 60,
        opacity: 0,
        duration: .46,
        ease: "back.out(2.1)"
      }, 5.18);
      tl.from(".pin-node.p1", {
        scale: 0,
        opacity: 0,
        duration: .38,
        ease: "expo.out"
      }, 5.02);
      tl.from(".pin-node.p2", {
        scale: 0,
        opacity: 0,
        duration: .42,
        ease: "back.out(1.8)"
      }, 5.8);
      tl.from(".coord-two", {
        x: 40,
        opacity: 0,
        duration: .7,
        ease: "power3.out"
      }, 5.55);
      tl.from(".glass-foreground", {
        x: -260,
        rotationY: 72,
        opacity: 0,
        duration: 1.2,
        ease: "sine.out"
      }, 4.1);
      tl.to(".discover-img", {
        y: -18,
        rotation: -1.1,
        scaleX: 1.01,
        scaleY: .99,
        duration: 1.28,
        repeat: 2,
        yoyo: true,
        ease: "sine.inOut"
      }, 4.6);
      tl.to(".discover-camera", {
        x: -72,
        y: -28,
        scale: 1.075,
        rotationZ: -.8,
        duration: 3.55,
        ease: "none"
      }, 4.0);
      tl.to(".mood-bead", {
        backgroundColor: "#ffcf8a",
        boxShadow: "inset 0 0 24px rgba(255,255,255,.46), 0 0 78px rgba(255,207,138,.8)",
        duration: .68,
        ease: "sine.inOut"
      }, 5.78);
      tl.to(".mood-bead", {
        backgroundColor: "#ff9fcb",
        boxShadow: "inset 0 0 24px rgba(255,255,255,.46), 0 0 78px rgba(255,159,203,.78)",
        duration: .68,
        ease: "sine.inOut"
      }, 6.52);

      // Scene 3 — overexposure reveal, then a still premium IP portrait.
      tl.to(".white-flash", {
        opacity: .92,
        duration: .18,
        ease: "power4.in"
      }, 7.38);
      tl.fromTo("#scene-resolve", {
        clipPath: "inset(100% 0 0 0)"
      }, {
