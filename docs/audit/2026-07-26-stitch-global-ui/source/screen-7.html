<!DOCTYPE html><html lang="zh-CN" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&amp;family=Be+Vietnam+Pro:wght@400;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "tertiary": "#331f00",
                        "on-secondary-fixed": "#390b00",
                        "outline-variant": "#d3c3bc",
                        "outline": "#81756e",
                        "inverse-surface": "#31302d",
                        "surface": "#fdfcf9", // Lighter surface
                        "secondary-fixed-dim": "#ffb59d",
                        "on-surface-variant": "#4f453f",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#772f16",
                        "tertiary-container": "#503300",
                        "tertiary-fixed-dim": "#f2be73",
                        "secondary": "#97472c",
                        "primary-fixed": "#ffdbc8",
                        "secondary-fixed": "#ffdbd0",
                        "surface-container-highest": "#f2f0eb", // Lighter
                        "surface-container-high": "#f7f5f0", // Lighter
                        "background": "#fdfcf9", // Lighter background
                        "on-secondary-fixed-variant": "#783017",
                        "primary": "#321f13",
                        "surface-dim": "#f0ede9", // Lighter
                        "surface-container": "#f8f6f2", // Lighter
                        "surface-variant": "#f2f0eb", // Lighter
                        "surface-container-low": "#faf9f6", // Very light warm tint
                        "on-primary-fixed-variant": "#594234",
                        "on-error": "#ffffff",
                        "on-background": "#1c1c19",
                        "inverse-on-surface": "#fdfcf9",
                        "on-tertiary-fixed": "#291800",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1c1c19",
                        "on-error-container": "#93000a",
                        "surface-bright": "#fdfcf9", // Lighter
                        "on-tertiary-fixed-variant": "#624000",
                        "secondary-container": "#fe9978",
                        "primary-container": "#4a3427",
                        "on-tertiary-container": "#ca9a54",
                        "surface-tint": "#73594a",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#e1c0ae",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#29170c",
                        "inverse-primary": "#e1c0ae",
                        "on-primary-container": "#bb9c8b",
                        "tertiary-fixed": "#ffddb2"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "stack-sm": "12px",
                        "stack-md": "24px",
                        "gutter": "16px",
                        "stack-lg": "40px",
                        "container-padding": "20px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Manrope"],
                        "body-md": ["Be Vietnam Pro"],
                        "label-caps": ["Manrope"],
                        "headline-md": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "body-lg": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700"}],
                        "headline-md": ["22px", {"lineHeight": "30px", "fontWeight": "600"}],
                        "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        @layer base {
            body {
                -webkit-tap-highlight-color: transparent;
                overscroll-behavior-y: none;
            }
            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom);
            }
            .pt-safe {
                padding-top: env(safe-area-inset-top);
            }
        }
        .cloud-shadow {
            box-shadow: 0 12px 40px -8px rgba(74, 52, 39, 0.05);
        }
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="text-on-surface font-body-md" style="background-color: rgb(253, 252, 251);">
<header class="fixed top-0 w-full z-50 pt-safe backdrop-blur-xl border-b border-surface-container bg-surface-bright/85" style="background-color: rgba(253, 252, 251, 0.85);">
<div class="h-14 px-container-padding flex items-center justify-between">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Decision Wheel</h1>
<div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[20px]">person</span>
</div>
</div>
</header>
<main class="relative w-full pt-20 pb-32">
<div class="flex flex-col w-full px-container-padding space-y-stack-lg">
<!-- Header Section -->
<section class="flex flex-col space-y-2">
<span class="font-label-caps text-label-caps text-secondary tracking-[0.2em] uppercase">Choice One</span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">今天喝什么？</h2>
<p class="font-body-md text-body-md text-on-surface-variant">把纠结交给转盘，把喜欢留给今天。</p>
</section><div class="flex p-1 bg-surface-container-low rounded-full w-fit">
<button class="px-6 py-2 rounded-full bg-primary text-on-primary font-bold text-body-md transition-all">
    纠结转盘
  </button>
<button class="px-6 py-2 rounded-full text-on-surface-variant font-bold text-body-md transition-all">
    抓娃娃机
  </button>
</div>
<!-- Selector Card -->
<section class="bg-surface-container-lowest rounded-lg cloud-shadow p-6 flex flex-col space-y-5">
<div class="flex items-center justify-between">
<span class="font-label-caps text-[10px] text-outline uppercase tracking-wider">当前转盘</span>
<div class="px-3 py-1 bg-surface-container-low rounded-full text-[10px] font-bold text-on-surface-variant">标准动效</div>
</div>
<div class="flex items-center justify-between bg-surface-container-low/50 border border-surface-container px-4 py-3.5 rounded-xl">
<span class="font-headline-md text-[18px] text-primary">今天喝什么咖啡</span>
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
<div class="pt-1 flex items-center justify-between">
<div class="flex flex-col min-w-0">
<span class="font-label-caps text-label-caps text-primary mb-1">5 个候选</span>
<p class="font-body-md text-[12px] text-on-surface-variant truncate">星巴克、瑞幸、Manner、Tims、M Stand</p>
</div>
<div class="flex gap-2.5">
<button class="flex flex-col items-center justify-center w-12 h-12 bg-surface-container-low rounded-2xl active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px] text-primary">edit</span>
<span class="text-[10px] font-bold text-primary">编辑</span>
</button>
<button class="flex flex-col items-center justify-center w-12 h-12 bg-surface-container-low rounded-2xl active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px] text-primary">add</span>
<span class="text-[10px] font-bold text-primary">新建</span>
</button>
</div>
</div>
</section>
<!-- The Wheel Section -->
<section class="relative flex flex-col items-center py-4 overflow-hidden">
<!-- Top Arrow -->
<div class="absolute top-0 z-10">
<svg fill="none" height="24" viewBox="0 0 24 24" width="24">
<path d="M12 24L24 0H0L12 24Z" fill="#321f13"></path>
</svg>
</div>
<!-- The Wheel -->
<div class="relative w-[300px] h-[300px] rounded-full cloud-shadow transition-transform duration-[3000ms] cubic-bezier(0.2, 0, 0.1, 1)" id="decision-wheel">
<svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
<!-- Segments -->
<path d="M 50 50 L 100 50 A 50 50 0 0 1 65.45 97.55 Z" fill="#D37556"></path>
<path d="M 50 50 L 65.45 97.55 A 50 50 0 0 1 9.55 79.39 Z" fill="#EBC078"></path>
<path d="M 50 50 L 9.55 79.39 A 50 50 0 0 1 9.55 20.61 Z" fill="#6D8CA4"></path>
<path d="M 50 50 L 9.55 20.61 A 50 50 0 0 1 65.45 2.45 Z" fill="#A4B48F"></path>
<path d="M 50 50 L 65.45 2.45 A 50 50 0 0 1 100 50 Z" fill="#CD937B"></path>
</svg>
<!-- Labels Overlay -->
<div class="absolute inset-0 pointer-events-none text-[12px] font-bold text-white/95">
<span class="absolute top-[28%] left-[65%] transform rotate-[18deg]">星巴克</span>
<span class="absolute top-[68%] left-[62%] transform rotate-[90deg]">瑞幸</span>
<span class="absolute top-[78%] left-[30%] transform rotate-[162deg]">Manner</span>
<span class="absolute top-[38%] left-[22%] transform rotate-[234deg]">Tims</span>
<span class="absolute top-[18%] left-[45%] transform rotate-[306deg]">M Stand</span>
</div>
<!-- Center Hub -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-primary rounded-full shadow-lg border-4 border-surface-container-lowest"></div>
</div>
<!-- Spin Button -->
<div class="mt-12 w-full max-w-[200px]">
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-headline-md text-headline-md shadow-xl shadow-primary/10 active:scale-95 active:shadow-md transition-all" id="spin-button">
                        转一下
                    </button>
</div>
</section>
<!-- Fun Little Tip -->
<div class="bg-surface-container-low/60 border border-surface-container rounded-xl p-5 flex items-start gap-3">
<span class="material-symbols-outlined text-secondary">lightbulb</span>
<p class="font-body-md text-[13px] text-on-surface-variant leading-relaxed">
                    当你犹豫不决时，转盘给出的答案往往就是你内心最真实的渴望。
                </p>
</div>
</div>
</main>
<nav class="fixed bottom-0 w-full z-50 pb-safe backdrop-blur-xl border-t border-surface-container/50 bg-surface-bright/90" data-active-classes="text-secondary font-bold">
<div class="h-16 px-gutter flex items-center justify-around">
<a class="flex flex-col items-center gap-1 text-on-surface-variant transition-colors" data-path="today" href="#">
<span class="material-symbols-outlined">coffee</span>
<span class="font-label-caps text-[10px]">今日</span>
</a>
<a class="flex flex-col items-center gap-1 text-on-surface-variant transition-colors" data-path="calendar" href="#">
<span class="material-symbols-outlined">calendar_month</span>
<span class="font-label-caps text-[10px]">日历</span>
</a>
<a aria-current="page" class="flex flex-col items-center gap-1 transition-colors text-secondary font-bold" data-path="decision-wheel" href="#">
<span class="material-symbols-outlined">explore</span>
<span class="font-label-caps text-[10px]">纠结</span>
</a>
<a class="flex flex-col items-center gap-1 text-on-surface-variant transition-colors" data-path="profile" href="#">
<span class="material-symbols-outlined">account_circle</span>
<span class="font-label-caps text-[10px]">我的</span>
</a>
</div>
</nav>
<script>
        (function() {
            const wheel = document.getElementById('decision-wheel');
            const btn = document.getElementById('spin-button');
            let currentRotation = 0;
            let isSpinning = false;

            btn.addEventListener('click', () => {
                if (isSpinning) return;
                
                isSpinning = true;
                btn.disabled = true;
                btn.style.opacity = '0.7';

                const extraDegrees = Math.floor(Math.random() * 360);
                const spins = (Math.floor(Math.random() * 5) + 5) * 360;
                currentRotation += spins + extraDegrees;

                wheel.style.transform = `rotate(${currentRotation}deg)`;

                setTimeout(() => {
                    isSpinning = false;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    
                    wheel.animate([
                        { transform: `rotate(${currentRotation}deg) scale(1)` },
                        { transform: `rotate(${currentRotation}deg) scale(1.05)` },
                        { transform: `rotate(${currentRotation}deg) scale(1)` }
                    ], {
                        duration: 400,
                        easing: 'ease-out'
                    });
                }, 3000);
            });
        })();
    </script>


</body></html>
