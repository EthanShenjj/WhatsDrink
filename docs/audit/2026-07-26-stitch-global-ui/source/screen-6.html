<!DOCTYPE html><html lang="zh-CN" style="width: 390px; height: 1315px; overflow: hidden; position: relative;"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&amp;family=Be+Vietnam+Pro:wght@400;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "error-container": "#ffdad6", "tertiary": "#331f00", "on-secondary-fixed": "#390b00", "outline-variant": "#d3c3bc", "outline": "#81756e", "inverse-surface": "#31302d", "surface": "#fcf9f4", "secondary-fixed-dim": "#ffb59d", "on-surface-variant": "#4f453f", "error": "#ba1a1a", "on-secondary-container": "#772f16", "tertiary-container": "#503300", "tertiary-fixed-dim": "#f2be73", "secondary": "#97472c", "primary-fixed": "#ffdbc8", "secondary-fixed": "#ffdbd0", "surface-container-highest": "#e5e2dd", "surface-container-high": "#ebe8e3", "background": "#fcf9f4", "on-secondary-fixed-variant": "#783017", "primary": "#321f13", "surface-dim": "#dcdad5", "surface-container": "#f0ede9", "surface-variant": "#e5e2dd", "surface-container-low": "#f6f3ee", "on-primary-fixed-variant": "#594234", "on-error": "#ffffff", "on-background": "#1c1c19", "inverse-on-surface": "#f3f0eb", "on-tertiary-fixed": "#291800", "on-secondary": "#ffffff", "on-surface": "#1c1c19", "on-error-container": "#93000a", "surface-bright": "#fcf9f4", "on-tertiary-fixed-variant": "#624000", "secondary-container": "#fe9978", "primary-container": "#4a3427", "on-tertiary-container": "#ca9a54", "surface-tint": "#73594a", "on-tertiary": "#ffffff", "primary-fixed-dim": "#e1c0ae", "surface-container-lowest": "#ffffff", "on-primary": "#ffffff", "on-primary-fixed": "#29170c", "inverse-primary": "#e1c0ae", "on-primary-container": "#bb9c8b", "tertiary-fixed": "#ffddb2" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "base": "8px", "stack-sm": "12px", "stack-md": "24px", "gutter": "16px", "stack-lg": "40px", "container-padding": "20px" }, "fontFamily": { "headline-lg-mobile": ["Manrope"], "body-md": ["Be Vietnam Pro"], "label-caps": ["Manrope"], "headline-md": ["Manrope"], "headline-lg": ["Manrope"], "body-lg": ["Be Vietnam Pro"] }, "fontSize": { "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}], "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}], "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700"}], "headline-md": ["22px", {"lineHeight": "30px", "fontWeight": "600"}], "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}], "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}] } } } }</script><style>@layer base { body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom); } .pt-safe { padding-top: env(safe-area-inset-top); } } .cloud-shadow { box-shadow: 0 10px 30px -5px rgba(74, 52, 39, 0.08); } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-surface text-on-surface font-body-md" style="background-color: rgb(253, 252, 251);"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl"><div class="h-14 px-container-padding flex items-center justify-between"><h1 class="font-headline-md text-headline-md text-primary tracking-tight">Decision Wheel</h1><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="relative w-full pt-14 pb-32 bg-surface" style="background-color: rgb(253, 252, 251);"><div class="flex flex-col w-full px-container-padding animate-in fade-in duration-700">
<!-- Header Section -->
<header class="flex flex-col mb-stack-lg">
<span class="font-label-caps text-label-caps text-on-secondary-fixed-variant mb-base">CUSTOM WHEEL</span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-base">编辑转盘</h2>
<p class="font-body-md text-body-md text-on-surface-variant">管理转盘名称和候选项，保存后会同步到 Choice One。</p>
</header>
<!-- Visual Hero Card -->

<!-- Wheel Name Input -->
<div class="bg-surface-container-lowest rounded-lg p-gutter mb-stack-md cloud-shadow">
<label class="font-label-caps text-label-caps text-outline block mb-base">转盘名称</label>
<div class="flex items-center gap-3 bg-surface-container-low px-4 py-3 rounded-full">
<span class="material-symbols-outlined text-primary text-[20px]">edit_note</span>
<input class="bg-transparent border-none outline-none font-body-lg text-body-lg text-primary w-full" placeholder="输入转盘标题..." type="text" value="今天喝什么咖啡">
</div>
</div>
<!-- Add Candidates Section -->
<div class="bg-surface-container-lowest rounded-lg p-gutter mb-stack-md cloud-shadow">
<div class="flex justify-between items-center mb-stack-sm">
<h3 class="font-headline-md text-[18px] text-primary">添加候选</h3>
<span class="font-label-caps text-label-caps text-outline">最多 20 项</span>
</div>
<!-- Custom Input -->
<div class="flex gap-2 mb-4">
<input class="flex-1 bg-surface-container-low px-4 py-3 rounded-full font-body-md text-body-md text-on-surface outline-none" id="customInput" placeholder="输入品牌或种类..." type="text">
<button class="bg-primary text-on-primary px-6 py-3 rounded-full font-label-caps text-label-caps flex items-center gap-1 active:scale-95 transition-transform" onclick="addItem()">
<span class="material-symbols-outlined text-[18px]">add</span>
                添加
            </button>
</div>
<!-- Brand Library Selection -->
<div class="flex items-center gap-3 bg-surface-container-low px-4 py-3 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">local_cafe</span>
<select class="bg-transparent border-none outline-none font-body-md text-body-md text-on-surface w-full appearance-none">
<option disabled="" selected="" value="">从热门品牌中选择...</option>
<option value="Peet's">Peet's 咖啡</option>
<option value="Blue Bottle">蓝瓶咖啡</option>
<option value="Seesaw">Seesaw Coffee</option>
<option value="Metal Hands">Metal Hands</option>
</select>
<button class="text-secondary font-label-caps text-label-caps whitespace-nowrap pl-2">+ 加入</button>
</div>
</div>
<!-- Candidates List -->
<div class="flex flex-col gap-base mb-stack-lg">
<div class="flex justify-between items-center px-2 mb-base">
<h3 class="font-headline-md text-[18px] text-primary">候选项</h3>
<span class="font-label-caps text-label-caps text-secondary bg-secondary-container/20 px-3 py-1 rounded-full" id="itemCount">5 / 20</span>
</div>
<div class="flex flex-col bg-surface-container-lowest rounded-lg overflow-hidden cloud-shadow" id="itemsContainer"><div class="flex items-center justify-between p-4 border-b border-surface-container-low group hover:bg-surface-container-high transition-colors"><div class="flex items-center gap-4"><span class="font-label-caps text-label-caps text-outline w-4">1.</span><span class="font-body-lg text-body-lg text-primary">星巴克</span></div><button class="text-outline hover:text-error transition-colors p-1" onclick="this.parentElement.remove(); updateCount();"><span class="material-symbols-outlined text-[20px]">delete_outline</span></button></div><div class="flex items-center justify-between p-4 border-b border-surface-container-low group hover:bg-surface-container-high transition-colors"><div class="flex items-center gap-4"><span class="font-label-caps text-label-caps text-outline w-4">2.</span><span class="font-body-lg text-body-lg text-primary">瑞幸</span></div><button class="text-outline hover:text-error transition-colors p-1" onclick="this.parentElement.remove(); updateCount();"><span class="material-symbols-outlined text-[20px]">delete_outline</span></button></div><div class="flex items-center justify-between p-4 border-b border-surface-container-low group hover:bg-surface-container-high transition-colors"><div class="flex items-center gap-4"><span class="font-label-caps text-label-caps text-outline w-4">3.</span><span class="font-body-lg text-body-lg text-primary">Manner</span></div><button class="text-outline hover:text-error transition-colors p-1" onclick="this.parentElement.remove(); updateCount();"><span class="material-symbols-outlined text-[20px]">delete_outline</span></button></div><div class="flex items-center justify-between p-4 border-b border-surface-container-low group hover:bg-surface-container-high transition-colors"><div class="flex items-center gap-4"><span class="font-label-caps text-label-caps text-outline w-4">4.</span><span class="font-body-lg text-body-lg text-primary">Tims</span></div><button class="text-outline hover:text-error transition-colors p-1" onclick="this.parentElement.remove(); updateCount();"><span class="material-symbols-outlined text-[20px]">delete_outline</span></button></div><div class="flex items-center justify-between p-4 group hover:bg-surface-container-high transition-colors"><div class="flex items-center gap-4"><span class="font-label-caps text-label-caps text-outline w-4">5.</span><span class="font-body-lg text-body-lg text-primary">M Stand</span></div><button class="text-outline hover:text-error transition-colors p-1" onclick="this.parentElement.remove(); updateCount();"><span class="material-symbols-outlined text-[20px]">delete_outline</span></button></div></div>
</div>
<!-- Action Bar -->
<div class="fixed bottom-20 left-0 w-full px-container-padding py-4 bg-gradient-to-t from-surface via-surface to-transparent pointer-events-none">
<div class="flex gap-4 pointer-events-auto">
<button class="flex-1 bg-surface-container-highest text-primary font-label-caps text-label-caps py-4 rounded-full active:opacity-70 transition-opacity">
                取消
            </button>
<button class="flex-[2] bg-primary text-on-primary font-label-caps text-label-caps py-4 rounded-full cloud-shadow active:scale-[0.98] transition-transform">
                保存同步
            </button>
</div>
</div>
<script>
        function addItem() {
            const input = document.getElementById('customInput');
            const container = document.getElementById('itemsContainer');
            const countLabel = document.getElementById('itemCount');
            
            if (input.value.trim() !== '') {
                const count = container.children.length + 1;
                if (count > 20) return;

                const div = document.createElement('div');
                div.className = "flex items-center justify-between bg-surface-container-lowest p-4 rounded-lg animate-in slide-in-from-right duration-300";
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <span class="font-label-caps text-label-caps text-outline w-4">${count}.</span>
                        <span class="font-body-lg text-body-lg text-primary">${input.value}</span>
                    </div>
                    <button class="text-outline hover:text-error transition-colors p-1" onclick="this.parentElement.remove(); updateCount();">
                        <span class="material-symbols-outlined text-[20px]">delete_outline</span>
                    </button>
                `;
                container.appendChild(div);
                input.value = '';
                updateCount();
            }
        }

        function updateCount() {
            const container = document.getElementById('itemsContainer');
            const countLabel = document.getElementById('itemCount');
            const items = container.children;
            countLabel.innerText = `${items.length} / 20`;
            
            // Re-index
            Array.from(items).forEach((item, index) => {
                item.querySelector('.font-label-caps').innerText = `${index + 1}.`;
            });
        }
    </script>
</div></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl cloud-shadow" data-active-classes="text-secondary font-bold"><div class="h-16 px-gutter flex items-center justify-around"><a class="flex flex-col items-center gap-1 text-on-surface-variant transition-colors" data-path="today" href="#"><span class="material-symbols-outlined">coffee</span><span class="font-label-caps text-label-caps">今日</span></a><a class="flex flex-col items-center gap-1 text-on-surface-variant transition-colors" data-path="calendar" href="#"><span class="material-symbols-outlined">calendar_month</span><span class="font-label-caps text-label-caps">日历</span></a><a aria-current="page" class="flex flex-col items-center gap-1 transition-colors text-secondary font-bold" data-path="decision-wheel" href="#"><span class="material-symbols-outlined">explore</span><span class="font-label-caps text-label-caps">纠结</span></a><a class="flex flex-col items-center gap-1 text-on-surface-variant transition-colors" data-path="profile" href="#"><span class="material-symbols-outlined">account_circle</span><span class="font-label-caps text-label-caps">我的</span></a></div></nav>

</body></html>
