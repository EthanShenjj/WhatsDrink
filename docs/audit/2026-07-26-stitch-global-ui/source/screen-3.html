<!DOCTYPE html><html lang="zh-CN" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&amp;family=Be+Vietnam+Pro:wght@400;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "tertiary": "#331f00",
                        "on-secondary-fixed": "#390b00",
                        "outline-variant": "#eee7e3",
                        "outline": "#81756e",
                        "inverse-surface": "#31302d",
                        "surface": "#fdfcfb",
                        "secondary-fixed-dim": "#ffb59d",
                        "on-surface-variant": "#5a504a",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#772f16",
                        "tertiary-container": "#503300",
                        "tertiary-fixed-dim": "#f2be73",
                        "secondary": "#97472c",
                        "primary-fixed": "#ffdbc8",
                        "secondary-fixed": "#ffdbd0",
                        "surface-container-highest": "#f2efed",
                        "surface-container-high": "#f8f5f3",
                        "background": "#fdfcfb",
                        "on-secondary-fixed-variant": "#783017",
                        "primary": "#321f13",
                        "surface-dim": "#f0ede9",
                        "surface-container": "#fbf9f7",
                        "surface-variant": "#f4f1ef",
                        "surface-container-low": "#fdfbf9",
                        "on-primary-fixed-variant": "#594234",
                        "on-error": "#ffffff",
                        "on-background": "#1c1c19",
                        "inverse-on-surface": "#fdfcfb",
                        "on-tertiary-fixed": "#291800",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1c1c19",
                        "on-error-container": "#93000a",
                        "surface-bright": "#fdfcfb",
                        "on-tertiary-fixed-variant": "#624000",
                        "secondary-container": "#fe9978",
                        "primary-container": "#4a3427",
                        "on-tertiary-container": "#ca9a54",
                        "surface-tint": "#73594a",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#e1c0ae",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#29170c",
                        "inverse-primary": "#e1c0ae",
                        "on-primary-container": "#bb9c8b",
                        "tertiary-fixed": "#ffddb2"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "stack-sm": "12px",
                        "stack-md": "24px",
                        "gutter": "16px",
                        "stack-lg": "40px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Manrope"],
                        "body-md": ["Be Vietnam Pro"],
                        "label-caps": ["Manrope"],
                        "headline-md": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "body-lg": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700"}],
                        "headline-md": ["22px", {"lineHeight": "30px", "fontWeight": "600"}],
                        "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        @layer base {
            body {
                -webkit-tap-highlight-color: transparent;
                overscroll-behavior-y: none;
            }
            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom);
            }
            .pt-safe {
                padding-top: env(safe-area-inset-top);
            }
        }
        .cloud-shadow {
            box-shadow: 0 8px 30px -4px rgba(74, 52, 39, 0.05);
        }
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="text-on-surface font-body-md bg-surface-bright" style="background-color: rgb(253, 252, 251);">
<header class="fixed top-0 w-full z-50 pt-safe backdrop-blur-xl bg-surface-bright/80" style="background-color: rgba(253, 252, 251, 0.8);">
<div class="h-14 px-container-padding flex items-center justify-between">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Today</h1>
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
</div>
</div>
</header>
<main class="relative w-full pt-14 pb-32 bg-surface-bright" style="background-color: rgb(253, 252, 251);">
<div class="flex flex-col w-full px-container-padding animate-in fade-in duration-700">
<!-- Header Section -->
<div class="flex flex-col mb-stack-lg mt-4">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest mb-1">Your Profile</span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">个人资料</h2>
</div>
<!-- Avatar Upload Section -->
<div class="flex justify-center mb-stack-lg">
<div class="relative group">
<div class="w-32 h-32 rounded-full overflow-hidden cloud-shadow bg-surface-container-high ring-4 ring-white">
<img alt="User Profile Picture" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBZsOXjZkRVFn8z5oXdElpWA_eL-xiaY5SKgHaM4VKaLRcXO02nbQIzJqGbu29R4F3F7g08SIRY-hB5EWWVjtT-Tm3ndi9VXGjD8ioYU8CdC1led3qpKzbwWHmM7tbrVU-JoXTeu_NKCncOT_ApR9uvGn_aIRbO15lmUWbHmujbvZ7OuTrDp2KuNYPBfYSs91QsN2Wrj-djQnXGuaJKkgCvhSI4szqTUq7l59ZibiSznWjfEDNOZR0y106huH-0bB22AY_yvqBRVQ">
</div>
<button aria-label="Upload photo" class="absolute bottom-0 right-0 w-10 h-10 bg-primary rounded-full flex items-center justify-center text-on-primary cloud-shadow transform transition-transform active:scale-90 border-2 border-white">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
</div>
</div>
<!-- Form Section -->
<div class="flex flex-col gap-gutter">
<!-- Nickname Input -->
<div class="bg-surface-container-lowest p-gutter rounded-lg cloud-shadow flex flex-col gap-2 transition-all border border-surface-variant/30 focus-within:ring-1 focus-within:ring-secondary/20 focus-within:border-secondary/30">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="nickname">昵称</label>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline text-[20px]">person_outline</span>
<input class="bg-transparent border-none outline-none w-full font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant" id="nickname" placeholder="Ethan" type="text">
</div>
</div>
<!-- Bio Input -->
<div class="bg-surface-container-lowest p-gutter rounded-lg cloud-shadow flex flex-col gap-2 border border-surface-variant/30">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="bio">关于我</label>
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-outline text-[20px] mt-0.5">signature</span>
<textarea class="bg-transparent border-none outline-none w-full font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant resize-none" id="bio" placeholder="分享你的咖啡哲学..." rows="2"></textarea>
</div>
</div>
<!-- Preferences Chip Group -->
<div class="mt-4">
<p class="font-label-caps text-label-caps text-on-surface-variant mb-3 px-1">偏好设置</p>
<div class="flex flex-wrap gap-3">
<button class="px-4 py-2 rounded-full bg-primary-container text-on-primary-container font-body-md text-body-md flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">coffee</span>
                            深烘
                        </button>
<button class="px-4 py-2 rounded-full bg-surface-variant/50 text-on-surface-variant font-body-md text-body-md flex items-center gap-2">
                            燕麦奶
                        </button>
<button class="px-4 py-2 rounded-full bg-surface-variant/50 text-on-surface-variant font-body-md text-body-md flex items-center gap-2">
                            无糖
                        </button>
</div>
</div>
</div>
<!-- Action Button -->
<div class="mt-stack-lg">
<button class="w-full h-14 bg-primary text-on-primary font-headline-md text-headline-md rounded-full shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="saveBtn">
                    保存资料
                    <span class="material-symbols-outlined">check_circle</span>
</button>
<p class="text-center text-on-surface-variant text-body-md mt-gutter px-6 opacity-70">
                    更新您的个人资料后，您的好友将在社区中看到最新的动态。
                </p>
</div>
</div>
</main>
<nav class="fixed bottom-0 w-full z-50 pb-safe backdrop-blur-xl cloud-shadow bg-surface-bright/90 border-t border-surface-variant/20" data-active-classes="text-secondary font-bold" style="background-color: rgba(253, 252, 251, 0.9);">
<div class="h-16 px-gutter flex items-center justify-around">
<a aria-current="page" class="flex flex-col items-center gap-1 transition-colors text-secondary font-bold" data-path="today" href="#">
<span class="material-symbols-outlined">coffee</span>
<span class="font-label-caps text-label-caps">今日</span>
</a>
<a class="flex flex-col items-center gap-1 text-on-surface-variant transition-colors" data-path="calendar" href="#">
<span class="material-symbols-outlined">calendar_month</span>
<span class="font-label-caps text-label-caps">日历</span>
</a>
<a class="flex flex-col items-center gap-1 text-on-surface-variant transition-colors" data-path="decision-wheel" href="#">
<span class="material-symbols-outlined">explore</span>
<span class="font-label-caps text-label-caps">纠结</span>
</a>
<a class="flex flex-col items-center gap-1 text-on-surface-variant transition-colors" data-path="profile" href="#">
<span class="material-symbols-outlined">account_circle</span>
<span class="font-label-caps text-label-caps">我的</span>
</a>
</div>
</nav>
<script>
        document.getElementById('saveBtn').addEventListener('click', function() {
            const btn = this;
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">done_all</span> 保存成功';
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-secondary');
                
                const toast = document.createElement('div');
                toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-6 py-3 rounded-full text-body-md shadow-xl z-[100] animate-bounce';
                toast.innerText = '✨ 个人资料已更新';
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.classList.add('fade-out');
                    setTimeout(() => toast.remove(), 500);
                    btn.innerHTML = originalContent;
                    btn.classList.remove('bg-secondary');
                    btn.classList.add('bg-primary');
                    btn.classList.remove('opacity-80');
                }, 2000);
            }, 800);
        });

        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                const container = input.closest('.bg-surface-container-lowest');
                container.style.transform = 'translateY(-2px)';
                container.style.boxShadow = '0 12px 25px -8px rgba(74, 52, 39, 0.08)';
            });
            input.addEventListener('blur', () => {
                const container = input.closest('.bg-surface-container-lowest');
                container.style.transform = 'translateY(0)';
                container.style.boxShadow = '';
            });
        });
    </script>


</body></html>
