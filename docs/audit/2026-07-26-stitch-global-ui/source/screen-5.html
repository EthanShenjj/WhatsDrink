<script>

      el.addEventListener('touchend', () => {

      });
    });

    // Simple Star Rating Toggle Logic (Mock)
    const starContainer = document.querySelector('.material-symbols-outlined:last-of-type').parentElement;
    starContainer.addEventListener('click', (e) => {
      if (e.target.innerText === 'star') {
        const stars = Array.from(starContainer.children);
        const index = stars.indexOf(e.target);
        stars.forEach((star, i) => {
          if (i <= index) {
            star.style.fontVariationSettings = "'FILL' 1";
            star.classList.replace('text-outline-variant', 'text-secondary');
          } else {
            star.style.fontVariationSettings = "'FILL' 0";
            star.classList.replace('text-secondary', 'text-outline-variant');
          }
        });
      }
